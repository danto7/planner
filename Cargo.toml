[package]
name = "planner"
version = "0.1.0"
edition = "2021"
description = "A week planner that schedules CalDAV tasks around your calendar"

[dependencies]
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui = "0.36"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls-no-provider", "charset"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
url = "2"
roxmltree = "0.21"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
serde = { version = "1", features = ["derive"] }
toml = "1"
dirs = "7"
uuid = { version = "1", features = ["v4"] }
anyhow = "1"
log = "0.4"
env_logger = "0.11"

image = { version = "0.25", default-features = false, features = ["png"], optional = true }

[dev-dependencies]
serde_json = "1"
tempfile = "3"

[features]
default = []
# Debug aid: PLANNER_SCREENSHOT=out.png [PLANNER_SCREENSHOT_AFTER_MS=3000] saves a screenshot and exits.
screenshot = ["dep:image"]

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
